<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your poor</title>
</head>
<body>
    <p>
        What are you my brother, Poor ? <br>Go find a <span id="span">j*b</span> and choose a <br>Better plan !
    </p>
    <button id="btn">Go back</button>

    <style>
        body {
            display: flex;
            background-color: black;
            flex-direction: column;
            font-family: 'Poppins';
            font-weight: bold;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        p {
            font-size: 5vh;
        }

        #span {
            color: red;
        }

        #btn {
            font-size: 4vh;
            padding: 20px;
            border: none;
            border-radius: 20px;
            font-family: 'poppins';
            font-weight: bolder;
            background-color: red;
        }

        #btn:hover {
            background-color: hsl(0, 100%, 45%);
        }
    </style>
    <script>
        const btn = document.getElementById("btn")

        btn.onclick = function() {
            window.open("chooseplan.html")
        }
    </script>
</body>
</html>
