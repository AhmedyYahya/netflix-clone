<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflex copy</title>
</head>
<body>
    <header id="header">
        <img src="images/Logonetflix.png" alt="Neflix" width="200px">
        <h1>Log in</h1>
    </header>
    <div id="loginbox">
        <h1>Log in</h1>
        <div id="Inputs">
            <input type="text" placeholder="Type '123'" id="user">
            <input type="password" placeholder="Type 'abc'" id="pass">
        </div>
        <p style="font-size: 2.7vh; font-weight: bold; color: rgb(244, 0, 0)" id="wrong">Wrong passowrd or username</p>
        <button id="btn">Log in</button>
    </div>






    <style>

        * {
            transition: all 0.4s ease;
        }

        body {
            display: flex;
            background-image: url(images/nbg.png);
            background-size: cover;
            font-family: 'Poppins';
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: auto;
            
        }

        #header {
            display: flex;
            justify-content: space-between;
            font-size: 2vh;
            background-color: hsl(0, 3%, 14%);
            color: white;
            padding: 30px;
            max-height: 60px;
            border: none;
            box-shadow: 0 5px hsl(0, 100%, 50%);
            border-radius: 10px;
            width:500px;
            margin-top: 3px;
        }

        #loginbox {
            display: flex;
            color: white;
            background: rgba(0, 0, 0, 0.30);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(10px);
            width: 300px;
            padding: 50px;
            flex-direction: column;
            margin-top: 10px;
            border-radius: 20px;
            box-shadow: 0 10px hsl(0, 65%, 32%);
            border: 5px solid hsl(0, 78%, 36%);
            font-size: 4vh;
            align-items: center;
        }

        input {
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 4.45vh;
            width: 240px;
            box-shadow: 0 4px 0px rgb(221, 14, 14) ;
            border: 2px solid rgb(221, 14, 14);
            color: black;
            overflow: scroll;
        }

        #Inputs {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        #btn {
            padding: 20px;
            width: 150px;
            margin-top: 26px;
            font-size: 4vh;
            border-radius: 20px;
            background-color: brown;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        input:focus {
            transform: scale(1.02);
            background-color: hsl(0, 0%, 0%);
            color: white;
        }

        input:hover {
            background-color: hsl(0, 0%, 60%);
            transform: scale(1.02);
        }
    </style>

    <script>
        const username = "123";
        const password = "abc";

        const userinput = document.getElementById("user");
        const passinput = document.getElementById("pass");
        const btn = document.getElementById("btn");

        const wrong = document.getElementById("wrong");

        wrong.textContent = "";

        btn.onclick = function() {
            if (userinput.value === username && passinput.value === password) {
                window.open("chooseplan.html", "_blank");
            } else {
                wrong.textContent = "Wrong password or username1"
            }
        }
    </script>
</body>
</html>
